name: atualizar steam
on:
  schedule: [{cron: '0 */6 * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  steam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/steam.mjs
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: '76561198850038535'
      - run: |
          git config user.name "steam-bot"; git config user.email "bot@users.noreply.github.com"
          git add games.json; git diff --cached --quiet || (git commit -m "update steam" && git push)
